   <!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Verify your Sewdesk account</title>
      </head>

      <body style="
        margin: 0;
        padding: 0;
        background-color: #f5f5f5;
        font-family: Arial, Helvetica, sans-serif;
      ">
        <div style="
          max-width: 500px;
          margin: 40px auto;
          background: #ffffff;
          padding: 40px;
          border-radius: 10px;
        ">
          <h1 style="
            margin: 0 0 10px;
            font-size: 30px;
            color: #111111;
          ">
            Welcome to Sewdesk 
          </h1>

          <p style="
            font-size: 14px;
            line-height: 1.6;
            color: #444444;
          ">
            Thanks for creating your Sewdesk account.
            Please verify your email address by clicking the button below.
          </p>

          <div style="text-align: center; margin: 20px 0;">
            <a
              href="${verificationLink}"
              style="
                display: inline-block;
                padding: 14px 24px;
                background-color: #2f0691;
                color: #ffffff;
                text-decoration: none;
                border-radius: 6px;
                font-size: 14px;
                font-weight: bold;
              "
            >
              Verify Email
            </a>
          </div>

          <p style="
            font-size: 14px;
            line-height: 1.6;
            color: #666666;
          ">
            This verification link will expire in 5 minutes.
          </p>

          <p style="
            font-size: 14px;
            line-height: 1.6;
            color: #666666;
          ">
            If you didn't create a Sewdesk account, you can safely ignore
            this email.
          </p>

          <hr style="
            border: 0;
            border-top: 1px solid #eeeeee;
            margin: 30px 0;
          " />

          <p style="
            margin: 0;
            font-size: 12px;
            color: #999999;
            text-align: center;
          ">
            © Sewdesk. All rights reserved.
          </p>
        </div>
      </body>
    </html>
